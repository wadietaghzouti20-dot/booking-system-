name: Validate booking system

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Check Apps Script JavaScript syntax
        run: cp apps-script/Code.gs /tmp/Code.js && node --check /tmp/Code.js
      - name: Verify required frontend files exist
        run: test -s index.html && test -s styles.css && test -s app.js && test -s config.js
